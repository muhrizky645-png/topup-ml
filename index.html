<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOPUP ML</title>

<style>

body{
    font-family: Arial;
    padding:20px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

</style>

</head>
<body>

<h1>TOPUP ML</h1>

<button onclick="testOrder()">TEST ORDER</button>

<script>

async function testOrder(){

    try{

        const response = await fetch("/order",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                product:"ML86",
                userid:"12345678",
                zone:"1234"
            })
        });

        const data = await response.text();

        alert(data);

    }catch(err){

        alert(err.message);

    }

}

</script>

</body>
</html>
