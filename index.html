<!DOCTYPE html>
<html>
<head>
  <title>TOPUP ML</title>
</head>
<body>

<h1>TOPUP ML</h1>

<pre id="result"></pre>

<script>

async function loadProducts() {

  try {

    const response =
      await fetch("/products");

    const text =
      await response.text();

    document.getElementById("result")
      .innerText = text;

  } catch (err) {

    document.getElementById("result")
      .innerText = err.message;

  }

}

loadProducts();

</script>

</body>
</html>
