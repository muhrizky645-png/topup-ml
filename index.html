<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topup Mobile Legends</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Maven+Pro&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Maven Pro;
            background: #f5f5f5;
        }

        p {
            margin: 5px 0;
        }

        .bg-harga {
            background-color: #2196F3;
            color: white;
            padding: 8px;
        }

        .btn-primary {
            background-color: #2196F3;
            border-color: #2196F3;
        }

        .nav-pills .nav-link.active {
            background-color: #2196F3;
            color: white;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .modal-header {
            background-color: #2196F3;
            color: white;
        }
    </style>
</head>

<body>

    <div class="d-block position-absolute top-0 w-100"
        style="background-color:#2196F3;height:50px;border-bottom-left-radius:25px;border-bottom-right-radius:25px;">
    </div>

    <div class="container">

        <div class="card mt-3 mb-3 shadow-sm">

            <div class="card-header bg-white border-0">

                <div class="card-body">

                    <div class="row">

                        <div class="col-8">
                            <input type="text" class="form-control" placeholder="ID Player">
                        </div>

                        <div class="col-4">
                            <input type="text" class="form-control" placeholder="Zone ID">
                        </div>

                    </div>

                    <div class="input-group input-group-sm mt-3">
                        <span class="input-group-text">
                            Nickname
                        </span>

                        <input type="text" class="form-control" placeholder="Nama Player" disabled>
                    </div>

                </div>

                <ul class="nav nav-pills nav-fill p-1 bg-body rounded-3">

                    <li class="nav-item">
                        <button class="nav-link active rounded-3">
                            Diamond
                        </button>
                    </li>

                    <li class="nav-item">
                        <button class="nav-link rounded-3">
                            Membership
                        </button>
                    </li>

                </ul>

            </div>

        </div>

        <div class="row mt-3">

            <div class="col-12">

                <button class="btn btn-light bg-white border w-100 mb-2 shadow-sm py-2"
                    data-bs-toggle="modal"
                    data-bs-target="#modalTrx">

                    <div class="row align-items-center px-1">

                        <div class="col-8 text-start">
                            <p class="m-0" style="font-size:13px;">
                                86 Diamond
                            </p>
                        </div>

                        <div class="col-4 bg-harga rounded-5">
                            <p class="m-0 fw-bold">
                                Rp20.000
                            </p>
                        </div>

                    </div>

                </button>

            </div>

            <div class="col-12">

                <button class="btn btn-light bg-white border w-100 mb-2 shadow-sm py-2"
                    data-bs-toggle="modal"
                    data-bs-target="#modalTrx">

                    <div class="row align-items-center px-1">

                        <div class="col-8 text-start">
                            <p class="m-0" style="font-size:13px;">
                                172 Diamond
                            </p>
                        </div>

                        <div class="col-4 bg-harga rounded-5">
                            <p class="m-0 fw-bold">
                                Rp40.000
                            </p>
                        </div>

                    </div>

                </button>

            </div>

            <div class="col-12">

                <button class="btn btn-light bg-white border w-100 mb-2 shadow-sm py-2"
                    data-bs-toggle="modal"
                    data-bs-target="#modalTrx">

                    <div class="row align-items-center px-1">

                        <div class="col-8 text-start">
                            <p class="m-0" style="font-size:13px;">
                                Weekly Diamond Pass
                            </p>
                        </div>

                        <div class="col-4 bg-harga rounded-5">
                            <p class="m-0 fw-bold">
                                Rp28.000
                            </p>
                        </div>

                    </div>

                </button>

            </div>

        </div>

    </div>

    <div class="modal fade" id="modalTrx" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">
                        Lanjutkan Pembayaran
                    </h5>
                </div>

                <div class="modal-body">

                    <div class="row">

                        <div class="col-6 border-bottom">
                            Produk
                        </div>

                        <div class="col-6 text-end border-bottom fw-bold">
                            86 Diamond
                        </div>

                        <div class="col-6 border-bottom">
                            No Tujuan
                        </div>

                        <div class="col-6 text-end border-bottom fw-bold">
                            12345678
                        </div>

                        <div class="col-6 border-bottom">
                            Nickname
                        </div>

                        <div class="col-6 text-end border-bottom fw-bold">
                            Player ML
                        </div>

                        <div class="col-6 border-bottom">
                            Harga
                        </div>

                        <div class="col-6 text-end border-bottom fw-bold">
                            Rp20.000
                        </div>

                        <div class="col-12 mt-3">
                            <div class="border rounded-3 p-3 text-center">
                                Topup Mobile Legends
                            </div>
                        </div>

                    </div>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-light col"
                        data-bs-dismiss="modal">
                        Batal
                    </button>

                    <button class="btn btn-primary col">
                        Beli
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
