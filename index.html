<!DOCTYPE html>
<html>
<head>
  <title>TOPUP ML</title>
</head>
<body>

<h1>TOPUP ML</h1>

<button onclick="testOrder()">TEST ORDER</button>

<script>
async function testOrder() {

  try {

    const response = await fetch("/order", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        product: "ML86",
        userid: "12345678",
        zone: "1234"
      })
    });

    const data = await response.json();

    alert(JSON.stringify(data));

  } catch (err) {

    alert(err.message);

  }

}
</script>

</body>
</html>
