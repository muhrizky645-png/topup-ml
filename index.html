<!DOCTYPE html>
<html>
<head>
  <title>TOPUP ML</title>
</head>
<body>

<h1>TOPUP ML</h1>

<div id="products"></div>

<script>

async function loadProducts() {

  const response = await fetch("/products");

  const data = await response.json();

  console.log(data);

  const productsDiv =
    document.getElementById("products");

  productsDiv.innerHTML = "";

  // sesuaikan struktur API
  const list = data.data || [];

  list.forEach(product => {

    // filter mobile legends saja
    if (
      product.kategori &&
      product.kategori.includes("Mobile Legends")
    ) {

      productsDiv.innerHTML += `
        <div style="
          border:1px solid #ccc;
          padding:10px;
          margin:10px;
        ">

          <h3>${product.nama}</h3>

          <p>
            Harga:
            Rp ${product.harga}
          </p>

          <button onclick="
            orderProduct('${product.kode}')
          ">
            Beli
          </button>

        </div>
      `;
    }

  });

}


async function orderProduct(code) {

  const userid =
    prompt("Masukkan User ID");

  const zone =
    prompt("Masukkan Zone ID");

  const dest =
    userid + zone;

  const response =
    await fetch("/order", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        product: code,
        dest
      })

    });

  const result =
    await response.json();

  alert(result.result);

}


loadProducts();

</script>

</body>
</html>
