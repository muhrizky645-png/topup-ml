<script>

const API = "https://topup-ml-production.up.railway.app";

let produkList = [];

$(document).ready(function(){

    loadProducts();

});

async function loadProducts(){

    $("#data").html("");

    try{

        const res = await fetch(API + "/products");
        const data = await res.json();

        produkList = data.products.filter(item => {

            return (
                item.kode.includes("DML")
                ||
                item.keterangan.toLowerCase().includes("mobile legend")
            );

        });

        renderProducts(produkList);

    }catch(err){

        alert("Gagal load produk");

    }

}

function renderProducts(products){

    $("#data").html("");

    products.forEach(v => {

        $("#data").append(`

        <div class="col-12">

            <button
            class="btn btn-light bg-white border w-100 mb-2 shadow-sm py-2"
            onclick="getDetail('${v.kode}','${v.keterangan}','${v.harga}')">

                <div class="row align-items-center px-1">

                    <div class="col-8 text-start">
                        <p class="m-0" style="font-size:13px;">
                            ${v.keterangan}
                        </p>
                    </div>

                    <div class="col-4 bg-harga rounded-5">
                        <p class="m-0 fw-bold">
                            Rp ${v.harga}
                        </p>
                    </div>

                </div>

            </button>

        </div>

        `);

    });

}

function getDetail(kode,nama,harga){

    const id = $("#id").val();
    const zone = $("#zone").val();

    if(id == "" || zone == ""){

        Swal.fire({
            icon:"error",
            title:"Oops...",
            text:"ID dan Zone wajib diisi"
        });

        return;

    }

    $("#nama_produk").text(nama);

    $("#no_tujuan").text(id + " | " + zone);

    $("#harga").text("Rp " + harga);

    $("#full-desc").text(nama);

    $("#modalTrx").modal("show");

    $("#linkBelis").off("click").on("click", async function(){

        try{

            const res = await fetch(API + "/order",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    product:kode,
                    dest:id + zone

                })

            });

            const result = await res.text();

            alert(result);

        }catch(err){

            alert("Transaksi gagal");

        }

    });

}

$("#zone").on("change", async function(){

    const id = $("#id").val();
    const zone = $("#zone").val();

    if(id == "" || zone == "") return;

    $("#cek").val("Mengecek...");

    try{

        const res = await fetch(

            `https://cekid.solusimedia.my.id/api/game/mobilelegends/?id=${id}&server=${zone}&key=e5771acb669df2b`

        );

        const data = await res.json();

        if(data.nickname){

            $("#cek").val(data.nickname);

        }else{

            $("#cek").val("Nickname tidak ditemukan");

        }

    }catch(err){

        $("#cek").val("Gagal cek nickname");

    }

});

</script>
