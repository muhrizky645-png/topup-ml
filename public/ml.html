<script>

var API = "https://topup-ml-production.up.railway.app";

$(document).ready(function () {

    $('#dm').off('click');
    $('#mm').off('click');

    $('#dm').on('click', function () {
        getData("ML");
    });

    $('#mm').on('click', function () {
        getData("MEMBERSHIP");
    });

    getData("ML");

});

function getData(type) {

    $('#data').html('');
    $('#fake').html('');

    $.ajax({

        type: "GET",

        url: API + "/products",

        dataType: "json",

        beforeSend: function () {

            for (let i = 0; i < 10; i++) {

                $('#fake').append(

                    '<div class="col-12">' +
                    '<div class="btn btn-light w-100 mb-2 skeleton">' +
                    '<p class="skeleton-text"></p>' +
                    '</div>' +
                    '</div>'

                );

            }

        },

        success: function (response) {

            $('#fake').html('');

            let products = response.products;

            products.forEach(function (v) {

                if (type == "ML") {

                    if (
                        !v.kode.includes("DML")
                        &&
                        !v.keterangan.toLowerCase().includes("mobile legend")
                    ) {
                        return;
                    }

                }

                if (type == "MEMBERSHIP") {

                    if (
                        !v.keterangan.toLowerCase().includes("membership")
                    ) {
                        return;
                    }

                }

                $('#data').append(

                    '<div class="col-12">' +

                    '<button class="btn btn-light bg-white border w-100 mb-2 shadow-sm py-2"' +

                    'onclick="getDetail(' +

                    '\'' + v.kode + '\',' +

                    '\'' + v.keterangan + '\',' +

                    '\'' + v.harga + '\'' +

                    ')">' +

                    '<div class="row align-items-center px-1">' +

                    '<div class="col-8 text-start">' +

                    '<p class="m-0" style="font-size:13px;">' +

                    v.keterangan +

                    '</p>' +

                    '</div>' +

                    '<div class="col-4 bg-harga rounded-5">' +

                    '<p class="m-0 fw-bold">' +

                    'Rp ' + v.harga +

                    '</p>' +

                    '</div>' +

                    '</div>' +

                    '</button>' +

                    '</div>'

                );

            });

        },

        error: function () {

            Swal.fire({

                icon: 'error',
                title: 'Oops...',
                text: 'Gagal mengambil produk'

            });

        }

    });

}

function getDetail(kode, nama, harga) {

    let id = $('#id').val();
    let zone = $('#zone').val();

    if (id == '' || zone == '') {

        Swal.fire({

            icon: 'error',
            title: 'Oops...',
            text: 'ID dan Zone wajib diisi'

        });

        return;

    }

    $('#nama_produk').text(nama);

    $('#no_tujuan').text(id + " | " + zone);

    $('#harga').text("Rp " + harga);

    $('#full-desc').text(nama);

    $('#modalTrx').modal('show');

    $("#linkBelis").off("click").on("click", async function () {

        try {

            const res = await fetch(API + "/order", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    product: kode,
                    dest: id + zone

                })

            });

            const result = await res.text();

            Swal.fire({

                icon: 'info',
                title: 'Status',
                text: result

            });

        } catch (err) {

            Swal.fire({

                icon: 'error',
                title: 'Oops...',
                text: 'Transaksi gagal'

            });

        }

    });

}

$("#zone").on('change', function () {

    var id = $('#id').val();
    var zone = $('#zone').val();

    $.ajax({

        type: "GET",

        url:
        `https://cekid.solusimedia.my.id/api/game/mobilelegends/?id=${id}&server=${zone}&key=e5771acb669df2b`,

        dataType: "JSON",

        beforeSend: function () {

            $("#nick").html("Mengecek...");
            $("#cek").val("Mengecek...");

        },

        success: function (data) {

            if (data.nickname) {

                $("#nick").html(data.nickname);
                $("#cek").val(data.nickname);

            } else {

                $("#nick").html("Tidak ditemukan");
                $("#cek").val("Tidak ditemukan");

            }

        }

    });

});

</script>
