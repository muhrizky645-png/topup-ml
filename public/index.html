<!DOCTYPE html>
<html>
<head>
  <title>TOPUP ML</title>

  <style>

    body{
      font-family: Arial;
      padding:20px;
      background:#f5f5f5;
    }

    h1{
      color:#222;
    }

    .card{
      background:white;
      padding:15px;
      margin-bottom:10px;
      border-radius:10px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    button{
      padding:10px;
      border:none;
      background:#2196f3;
      color:white;
      border-radius:5px;
    }

    input{
      width:100%;
      padding:10px;
      margin-bottom:10px;
    }

  </style>

</head>
<body>

<h1>TOPUP ML</h1>

<input type="text" id="search" placeholder="Cari Produk">

<div id="products"></div>

<script>

const API =
"https://topup-ml-production.up.railway.app";

async function loadProducts(){

  const res =
  await fetch(API + "/products");

  const data =
  await res.json();

  const container =
  document.getElementById("products");

  container.innerHTML = "";

  data.products.forEach(item=>{

    if(item.status !== "1") return;

    const div =
    document.createElement("div");

    div.className = "card";

    div.innerHTML = `

      <h3>${item.keterangan}</h3>

      <p>Kode : ${item.kode}</p>

      <p>Harga : Rp ${item.harga}</p>

      <button onclick="order('${item.kode}')">
      BELI
      </button>

    `;

    container.appendChild(div);

  });

}

async function order(product){

  const dest =
  prompt("Masukkan ID Tujuan");

  if(!dest) return;

  const res =
  await fetch(API + "/order",{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({
      product,
      dest
    })

  });

  const data =
  await res.text();

  alert(data);

}

loadProducts();

</script>

</body>
</html>
